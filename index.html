<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Vibes | Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-headphones-simple"></i>
                <h2>Chill Vibes</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active" data-filter="all"><i class="fa-solid fa-house"></i> Home</a>
                <a href="#" data-filter="Lo-Fi"><i class="fa-solid fa-compass"></i> Lo-Fi Beats</a>
                <a href="#" data-filter="Night Drive"><i class="fa-solid fa-car"></i> Night Drive</a>
                <a href="#" id="fav-tab"><i class="fa-solid fa-heart"></i> Favorites</a>
            </nav>
            <div class="theme-toggle">
                <button id="theme-btn"><i class="fa-solid fa-moon"></i> <span>Toggle Theme</span></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search for songs, artists...">
                </div>
            </header>

            <section class="hero">
                <div class="hero-content">
                    <h1>Relax. Press play. Enjoy the vibe.</h1>
                    <p>Curated aesthetics for your late-night coding sessions and relaxing moments.</p>
                    <button class="play-hero-btn" id="play-hero-btn"><i class="fa-solid fa-play"></i> Play Featured</button>
                </div>
            </section>

            <section class="song-section">
                <h2 id="section-title">Discover</h2>
                <div class="song-grid" id="song-grid">
                    </div>
            </section>
        </main>

        <footer class="music-player">
            <div class="player-info">
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=200&auto=format&fit=crop" alt="Album Art" id="player-cover">
                <div class="track-details">
                    <h4 id="player-title">Select a song</h4>
                    <p id="player-artist">-</p>
                </div>
                <button class="fav-btn player-fav" id="player-fav-btn"><i class="fa-regular fa-heart"></i></button>
            </div>

            <div class="player-controls-container">
                <div class="controls">
                    <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="play-btn" class="play-pause-btn"><i class="fa-solid fa-play"></i></button>
                    <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <div class="player-volume">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
            
            <audio id="audio-element"></audio>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
